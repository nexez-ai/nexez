name: A2A Python SDK Interoperability

on:
  pull_request:
    paths:
      - .github/workflows/a2a-python-interop.yml
      - scripts/certify-a2a-python-interop.py
      - package.json
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact production commit SHA to certify
        required: true
        type: string
      run_authenticated:
        description: Run the authenticated official Python SDK lifecycle
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: a2a-python-interop-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-interop:
    name: Public discovery and auth boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pinned official A2A Python SDK
        run: python -m pip install a2a-sdk==1.1.5

      - name: Run public official Python SDK interoperability
        run: python scripts/certify-a2a-python-interop.py
        env:
          NEXEZ_A2A_PYTHON_INTEROP_MODE: public
          NEXEZ_A2A_INTEROP_BASE_URL: https://nexez.app
          NEXEZ_A2A_INTEROP_APP_BASE_URL: https://app.nexez.ai
          NEXEZ_A2A_PYTHON_INTEROP_REPORT_PATH: a2a-python-interop-public.json

      - name: Verify public report and secret hygiene
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('a2a-python-interop-public.json')
          raw = path.read_text(encoding='utf-8')
          report = json.loads(raw)
          if report.get('status') != 'passed' or report.get('mode') != 'public':
              raise SystemExit('Public Python SDK interoperability did not pass.')
          if 'nxz_live_' in raw or 'Authorization: Bearer ' in raw:
              raise SystemExit('Interoperability evidence contains credential material.')
          PY

      - name: Upload public interoperability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2a-python-interop-public-${{ github.run_id }}
          path: a2a-python-interop-public.json
          if-no-files-found: error
          retention-days: 90

  authenticated-interop:
    name: Authenticated official Python SDK lifecycle
    if: github.event_name == 'workflow_dispatch' && inputs.run_authenticated
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out certification source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify target production revision
        env:
          TARGET_SHA: ${{ inputs.commit_sha }}
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${TARGET_SHA}^{commit}"
          git merge-base --is-ancestor "$TARGET_SHA" HEAD

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pinned official A2A Python SDK
        run: python -m pip install a2a-sdk==1.1.5

      - name: Run authenticated official Python SDK interoperability
        run: python scripts/certify-a2a-python-interop.py
        env:
          NEXEZ_A2A_PYTHON_INTEROP_MODE: authenticated
          NEXEZ_A2A_INTEROP_BASE_URL: https://nexez.app
          NEXEZ_A2A_INTEROP_APP_BASE_URL: https://app.nexez.ai
          NEXEZ_A2A_PYTHON_INTEROP_REPORT_PATH: a2a-python-interop-authenticated.json
          NEXEZ_A2A_INTEROP_DEPLOYMENT_WAIT_SECONDS: '600'
          NEXEZ_COMMIT_SHA: ${{ inputs.commit_sha }}
          NEXEZ_A2A_CERT_API_KEY: ${{ secrets.NEXEZ_A2A_CERT_API_KEY }}
          NEXEZ_RELEASE_CERT_SECRET: ${{ secrets.NEXEZ_RELEASE_CERT_SECRET }}

      - name: Verify authenticated report and secret hygiene
        env:
          EXPECTED_SHA: ${{ inputs.commit_sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('a2a-python-interop-authenticated.json')
          raw = path.read_text(encoding='utf-8')
          report = json.loads(raw)
          if report.get('status') != 'passed' or report.get('mode') != 'authenticated':
              raise SystemExit('Authenticated Python SDK interoperability did not pass.')
          if report.get('commitSha') != os.environ['EXPECTED_SHA']:
              raise SystemExit('Authenticated evidence does not match the requested revision.')
          if 'nxz_live_' in raw or 'Authorization: Bearer ' in raw:
              raise SystemExit('Interoperability evidence contains credential material.')
          PY

      - name: Upload authenticated interoperability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2a-python-interop-authenticated-${{ github.run_id }}
          path: a2a-python-interop-authenticated.json
          if-no-files-found: error
          retention-days: 90
