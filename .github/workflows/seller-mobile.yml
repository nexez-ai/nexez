name: Nexez Seller Hub

# Nexez Seller Hub resolves its own dependencies and @/* paths. Verify the native
# package independently, then check its contracts against the web platform.
#
# Its own workflow rather than a job in ci.yml, so the paths filter can live at the
# workflow level. Same convention as openclaw-package-publish.yml and
# supabase-migrations.yml. A per-job filter inside ci.yml would need either a
# third-party action or a hand-rolled diff job; this needs neither.
on:
  push:
    branches: [main]
    paths:
      - 'apps/seller-mobile/**'
      - '.github/workflows/seller-mobile.yml'
      - 'lib/**/*.mobile-parity.test.ts'
      - 'lib/seller-mobile-*.test.ts'
      - 'lib/server/seller-mobile-*.test.ts'
      - 'lib/integration-capabilities.ts'
      - 'lib/public-identifier.ts'
      - 'lib/negotiation-rules.ts'
  pull_request:
    branches: [main]
    paths:
      - 'apps/seller-mobile/**'
      - '.github/workflows/seller-mobile.yml'
      - 'lib/**/*.mobile-parity.test.ts'
      - 'lib/seller-mobile-*.test.ts'
      - 'lib/server/seller-mobile-*.test.ts'
      - 'lib/integration-capabilities.ts'
      - 'lib/public-identifier.ts'
      - 'lib/negotiation-rules.ts'
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs for the same PR, matching ci.yml. Not on main, where a
# cancelled run would leave the branch unverified.
concurrency:
  group: seller-mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/seller-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Kept per AGENTS.md: the runner's cached Node 22 sits below the engine
          # floor some of this toolchain expects.
          check-latest: true
          cache: npm
          cache-dependency-path: apps/seller-mobile/package-lock.json
      - run: npm ci
      - name: Release configuration and artwork
        run: npm run check:release-config
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Expo dependency compatibility
        run: npm run check:expo-deps
      - name: Web bundle smoke
        run: npm run bundle:web

  platform-contracts:
    name: Seller Hub web and mobile contract parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:mobile-platform-contracts
